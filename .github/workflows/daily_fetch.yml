name: Daily Nord Pool Fetch

on:
  schedule:
    # 15:00 UTC daily -- safely after Nord Pool's ~11:00-12:00 UTC publish
    # window in both winter (CET) and summer (CEST). Cron here is ALWAYS
    # UTC; GitHub Actions has no DST awareness.
    - cron: '0 15 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab, e.g. for backfills

permissions:
  contents: write   # needed so the job can commit data/ back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the fetcher
        run: python -m CODE.fetch

      - name: Commit and push data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: daily fetch $(date -u +%F)"
          git push