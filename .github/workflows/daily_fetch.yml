name: Daily NordPool fetch

on:
  schedule:
    - cron: '0 12 * * *' # 12:00 UTC (adjust if needed)
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run fetch
        run: |
          python CODE/fetch.py --endpoints DayAheadPrices
      - name: Build site
        run: |
          python CODE/build_site.py
      - name: Commit data
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add data && git commit -m "data: daily fetch $(date -u +%F)" || echo "no changes"
          git push || echo "push failed"
